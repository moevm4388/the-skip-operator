[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifier-parser"
version = "0.1.0"
description = "Lexer and parser for the annotated algorithmic language"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/verifier_parser"]
